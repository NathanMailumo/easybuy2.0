version: '3.8'

services:
  # Laravel App Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: easybuy-app
    container_name: easybuy-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - easybuy-network

  # Nginx Web Server Container
  webserver:
    image: nginx:alpine
    container_name: easybuy-webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - easybuy-network

  # MySQL Database Container
  db:
    image: mysql:8.0
    container_name: easybuy-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: easybuy
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_PASSWORD: secretpassword
      MYSQL_USER: easybuy_user
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - easybuy-network

networks:
  easybuy-network:
    driver: bridge

volumes:
  dbdata:
    driver: local